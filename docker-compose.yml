x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BABO_CHANNELS: ${BABO_CHANNELS:-whatsapp}
  environment:
    # Bootstrap a working config.json on first boot (binds that work across
    # the container boundary; secrets generated if not provided).
    BABO_DOCKER_BOOTSTRAP: "1"
    BABO_WEB_TOKEN: ${BABO_WEB_TOKEN:-}
    BABO_API_KEY: ${BABO_API_KEY:-}
  volumes:
    - ~/.babo:/home/babo/.babo
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the babo user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  babo-gateway:
    container_name: babo-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  babo-api:
    container_name: babo-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/babo/.babo/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  babo-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
